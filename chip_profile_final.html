<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nguyễn Quốc Vinh | Chíp</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#fff;
    background:#08050d;
    display:flex;
    justify-content:center;
    padding:18px 12px;
}
.card{
    width:100%;
    max-width:500px;
    overflow:hidden;
    border-radius:28px;
    background:rgba(10,7,16,.94);
    border:1px solid #d5a900;
    box-shadow:0 20px 70px rgba(0,0,0,.75);
    position:relative;
}
.background{
    height:230px;
    position:relative;
    overflow:hidden;
}
.background img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.background:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(10,5,20,.05),#0a0710 100%);
}
.content{
    position:relative;
    padding:0 22px 30px;
    text-align:center;
}
.avatar{
    width:132px;
    height:132px;
    object-fit:cover;
    border-radius:50%;
    display:block;
    margin:-66px auto 16px;
    position:relative;
    z-index:2;
    border:4px solid #0a0710;
    outline:3px solid #e0b400;
    box-shadow:0 0 25px rgba(224,180,0,.35);
}
h1{margin:0;font-size:28px}
.nick{margin-top:7px;color:#d6d0df}
.badge{
    display:inline-block;
    margin-top:12px;
    padding:7px 13px;
    border-radius:50px;
    color:#ffd83d;
    border:1px solid #b99000;
    background:#211b08;
    font-size:12px;
}
.bio{margin:20px 0;color:#eee;line-height:1.6}
.links{display:grid;gap:12px}
.links a{
    display:block;
    text-decoration:none;
    color:#fff;
    padding:16px;
    border-radius:15px;
    font-weight:bold;
    background:linear-gradient(100deg,#171218,#342a08);
    border:1px solid #c39d19;
    box-shadow:inset 0 0 18px rgba(255,210,0,.04);
    transition:.2s;
}
.links a:hover{
    transform:translateY(-2px);
    background:linear-gradient(100deg,#251a2d,#4a3908);
    border-color:#ffe16a;
}
.info{
    margin-top:24px;
    padding-top:20px;
    border-top:1px solid #4b3c12;
    text-align:left;
    color:#bbb;
    line-height:2;
}
.info b{color:#fff}
.chick{
    position:absolute;
    z-index:3;
    font-size:27px;
    filter:drop-shadow(0 2px 5px #000);
}
.c1{top:18px;left:18px}
.c2{top:72px;right:18px}
.c3{bottom:105px;left:5px}
.c4{bottom:72px;right:5px}
</style>
</head>
